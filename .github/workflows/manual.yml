name: Constructor

on:
  push:
  pull_request:

jobs:
  Tests_frontend:
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: musictree-frontend/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Initialition Frontend
        run: |
          npm install

      - name: Test Frontend
        run: |
          npm run dev &             
          DEV_PID=$!                
          sleep 5                  
          kill $DEV_PID             

  Tests_backend:
    needs: Tests_frontend
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.107

      - name: Allow Backend (OPTIONAL)
        run: chmod +x setup_musictree.sh
        continue-on-error: true
        
      - name: Initialition Backend (OPTIONAL)
        run: |
          ./setup_musictree.sh
          y
          .
        continue-on-error: true

      - name: Test Backend
        run: |
          dotnet run &             
          DEV_PID=$!     
          sleep 20
          kill $DEV_PID   

  Tests:
